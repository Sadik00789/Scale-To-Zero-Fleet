name: Scale-To-Zero Fleet Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-argocd-sync:
    name: Verify Argo CD Application Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifest Syntaxes
        run: |
          echo "===================================================="
          echo " Verifying Argo CD App Manifests & K8s Spec Syntaxes "
          echo "===================================================="
          find k8s -name "*.yaml" -o -name "*.yml" | xargs -n 1 -I {} sh -c 'echo "Checking {}..."; yq e "." {} > /dev/null'
          echo "All Kubernetes and Argo CD manifests are valid!"

      - name: Simulate Argo CD Health & Sync Verification
        run: |
          echo "===================================================="
          echo " Verifying Argo CD Root Application Health & Sync   "
          echo "===================================================="
          echo "Target Cluster: scale-to-zero-eks"
          echo "Root App Status: Healthy / Synced"
          echo "Child Applications: karpenter-nodepool (Synced), arc-runner-scale-set (Synced), observability-stack (Synced)"
          echo "GitOps synchronization verified successfully!"

  heavy-build-job:
    name: Heavy Compute Benchmark
    needs: verify-argocd-sync
    runs-on: scale-to-zero-runner # Directs job to ARC scale set
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Heavy Compute Task
        run: |
          echo "===================================================="
          echo "Executing on Dynamic EC2 Spot Instance via Karpenter"
          echo "===================================================="
          hostname
          uname -a
          lscpu | grep "Model name\|CPU(s):"
          echo "Simulating 45s build process..."
          sleep 45
          echo "Build Complete!"