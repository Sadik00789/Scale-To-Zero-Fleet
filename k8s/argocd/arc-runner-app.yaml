apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-scale-set
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/Sadik00789/Scale-To-Zero-Fleet"
    targetRevision: HEAD
    path: k8s
    directory:
      include: "arc-runner-values.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
